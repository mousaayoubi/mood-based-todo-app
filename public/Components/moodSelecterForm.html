<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mood Selector | Moodana</title>

<link rel="icon" type="image/x-icon" href="/Assets/Images/favicon.ico">
<link rel="stylesheet" href="/Styles/moodSelecter.css">

<!-- Bootstrap (Optional) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="d-flex justify-content-center align-items-center vh-100">

    <div class="container">

        <!-- Close Button -->
        <a href="/">
            <img id="close_icon" src="/Assets/Images/close.png" alt="close" width="22" height="22">
        </a>

        <!-- Header -->
        <h3 id="header1">How are you feeling?</h3>

        <!-- Mood Faces Row -->
        <div id="faces-row">
            <img id="face1" src="/Assets/Images/sad-face.png" alt="Sad">
            <img id="face2" src="/Assets/Images/neutral-face.png" alt="Neutral">
            <img id="face3" src="/Assets/Images/happy-face.png" alt="Happy">
        </div>

        <!-- Mood Slider -->
        <input type="range" id="moodSlider" min="1" max="3" step="1" value="2">

    </div>

</div>

<footer>Moodana © 2025</footer>

<script src="/Scripts/moodSelecter.js"></script>
</body>
</html>
