<!DOCTYPE html>
<html lang="en">
<head>
    <title>Homepage | Mood based ToDo App | Moodana</title>
    <link rel="icon" type="image/x-icon" href="/Assets/Images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="This is a mood-based todo app. This page shows your daily tasks.">

    <!-- Styles -->
    <link rel="stylesheet" href="/Styles/index.css">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Handlebars -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
</head>

<body>
<div class="container">

    <!-- HEADER -->
    <header>
        <nav class="navbar align-items-center justify-content-between">

            <!-- Logo -->
            <a class="navbar-brand" href="/">
                <img src="/Assets/Images/logo.png" alt="logo" width="75" height="75">
            </a>

            <!-- Welcome + Account -->
            <div>
                <span id="welcome">Welcome<br>
                    <span id="account">Guest</span>
                </span>
            </div>

            <img src="/Assets/Images/spacing.png" width="500" height="50" alt="spacing">

            <!-- Icons -->
            <div class="d-flex align-items-center gap-3">
                <a href="/Components/moodSelecterForm.html">
                    <img src="/Assets/Images/mood.png" width="100" height="50" alt="mood icon">
                </a>

                <img id="weatherApi" src="/Assets/Images/weather.png" width="50" height="50" alt="weather icon">

                <img id="account_login" src="/Assets/Images/account.png" width="50" height="50" alt="account icon">
            </div>
        </nav>
    </header>

    <!-- LOGIN MESSAGE -->
    <div class="mt-3">
        <span id="login_message"></span>
    </div>

    <div class="row mt-4">

        <!-- TASKS COLUMN -->
        <div id="tasks" class="col">

            <!-- Header: Title + Count + Add Task + Show/Hide -->
            <div class="d-flex align-items-center justify-content-between mb-2">
                <!-- Left side: Title and count -->
                <div>
                    <span id="tasks_title">Ready for Today?</span><br>
                    <span id="tasks_number">You have tasks planned for today</span>
                </div>

                <!-- Right side: Add Task + Show/Hide Completed -->
                <div class="d-flex align-items-center gap-2">
                    <!-- Add Task Icon -->
                    <a href="/Components/taskCreationForm.html">
                        <img src="/Assets/Images/add_task.png" alt="add task icon">
                    </a>

                    <!-- Show/Hide Completed Tasks Button -->
                    <button id="completed_tasks_button" class="btn btn-secondary btn-sm">Show Completed</button>
                </div>
            </div>

            <!-- Dynamic Tasks Container -->
            <div id="task_container" class="row mt-3"></div>
        </div>

        <!-- SUGGESTED TASKS COLUMN -->
        <div id="suggested_tasks" class="col">

            <span id="suggested_tasks_title">Suggested tasks</span><br>

            <!-- Dynamic Suggested Tasks Container -->
            <div id="suggested_tasks_container" class="mt-3"></div>

            <!-- COMPLETED TASKS TITLE + CONTAINER -->
            <div class="mt-4">
                <h5 id="completed_tasks_title"></h5>
                <div id="completed_tasks_container" class="row"></div>
            </div>
        </div>
    </div>

    <!-- DELETE MESSAGE -->
    <div class="mt-3">
        <span id="task_delete_message"></span>
    </div>

    <!-- ================= HANDLEBARS TEMPLATES ================= -->

    <!-- Active Task Template -->
    <script id="task-template" type="text/x-handlebars-template">
        {{#each tasks}}
        <div class="col-md-6 mb-3">
            <div class="task_card" data-id="{{id}}">
                <div class="delete_hover">
                    <img class="delete_btn" src="/Assets/Images/bin.png" width="20" height="20" alt="delete">
                </div>

                <img class="check_btn" src="/Assets/Images/check_mark.png" width="20" height="20" alt="complete">

                <div class="task_name">{{taskName}}</div>
                <div class="task_duration">{{taskDuration}} mins</div>
                <div class="task_time">{{taskTime}}</div>
            </div>
        </div>
        {{/each}}
    </script>

    <!-- Completed Task Template -->
    <script id="completed-task-template" type="text/x-handlebars-template">
        {{#each tasks}}
        <div class="col-12 mb-3">
            <div class="task_card_completed">
                <div class="task_name">{{taskName}}</div>
                <div class="task_duration">{{taskDuration}}</div>
                <div class="task_time">{{taskTime}}</div>
            </div>
        </div>
        {{/each}}
    </script>

    <!-- Suggested Task Template -->
    <script id="suggested-task-template" type="text/x-handlebars-template">
        {{#each tasks}}
        <div class="suggested_tasks_border mt-3">
            <span class="{{titleClass}}">{{taskName}}</span>
            <span>
                {{#if moodIcon}}
                    <img class="mood_icon" src="/Assets/Images/{{moodIcon}}" width="{{moodWidth}}" height="{{moodHeight}}">
                {{/if}}
            </span><br>

            <span class="duration">{{taskDuration}} mins</span>
            <span id="based_on">Based on</span><br>

            <span class="time">{{taskTime}} <span class="time_hour">{{timePeriod}}</span></span>
            <span class="{{moodLabelClass}}">{{moodLabel}}</span><br>

            <span>
                <img class="check_mark_icon" src="/Assets/Images/check_mark.png" width="20" height="20">
            </span>
        </div>
        {{/each}}
    </script>

    <!-- ================= MAIN JS ================= -->
    <script src="/Scripts/index.js"></script>

    <footer class="mt-5 text-center">Moodana © 2025</footer>
</div>
</body>
</html>
