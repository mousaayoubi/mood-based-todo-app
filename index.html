<!DOCTYPE html>
<html lang="en">
<head>
    <title>Homepage | Mood based ToDo App | Moodana</title>
    <link rel="icon" type="image/x-icon" href="/Assets/Images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="This is a mood-based todo app. This page shows your daily tasks.">

    <!-- Styles -->
    <link rel="stylesheet" href="/Styles/index.css">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container">

        <!-- HEADER -->
        <header>
            <nav class="navbar align-items-center justify-content-between">

                <!-- Logo -->
                <a class="navbar-brand" href="/">
                    <img src="/Assets/Images/logo.png" alt="logo" width="75" height="75">
                </a>

                <!-- Welcome + Account -->
                <div>
                    <span id="welcome">Welcome<br>
                        <span id="account">Guest</span>
                    </span>
                </div>

                <img src="/Assets/Images/spacing.png" width="500" height="50" alt="spacing">

                <!-- Icons -->
                <div class="d-flex align-items-center gap-3">
                    <a href="/Components/moodSelecterForm.html">
                        <img src="/Assets/Images/mood.png" width="100" height="50" alt="mood icon">
                    </a>

                    <img src="/Assets/Images/weather.png" width="50" height="50" alt="weather icon">

                    <img id="account_login" src="/Assets/Images/account.png" width="50" height="50"
                        alt="account icon">
                </div>
            </nav>
        </header>

        <div class="row mt-4">

            <!-- TASKS COLUMN -->
            <div id="tasks" class="col">

                <span id="tasks_title">Ready for Today?</span> <br>
                <span id="tasks_number">You have tasks planned for today</span>

                <!-- Add Task Icon -->
                <span class="ms-3">
                    <a href="/Components/taskCreationForm.html">
                        <img src="/Assets/Images/add_task.png" alt="add task icon"></a>
		    <span><button id="completed_tasks_button">Show Completed</button></span>
                </span>

                <!-- Dynamic Tasks Container -->
                <div id="task_container" class="row mt-3"></div>
            </div>

            <!-- SUGGESTED TASKS COLUMN -->
            <div id="suggested_tasks" class="col">

                <span id="suggested_tasks_title">Suggested tasks</span><br>

                <div class="suggested_tasks_border mt-3">
                    <span class="title1">Read a Book</span>
                    <span><img class="mood_icon" src="/Assets/Images/neutral-face_orange.png" width="30" height="30"></span><br>

                    <span class="duration">45 mins</span>
                    <span id="based_on">Based on</span><br>

		    <span class="time">12:43 <span class="time_hour">PM</span></span>
                    <span class="mood_label1">Mood</span><br>

                    <span><img class="check_mark_icon" src="/Assets/Images/check_mark.png" width="20" height="20"></span>
                </div>

                <div class="suggested_tasks_border mt-3">
                    <span class="title2">Meditation</span>
                    <span><img class="mood_icon" src="/Assets/Images/cloud_yellow.png" width="35" height="35"></span><br>

                    <span class="duration">15 mins</span>
                    <span id="based_on">Based on</span><br>

		    <span class="time">12:43 <span class="time_hour">PM</span></span>
                    <span class="mood_label2">Weather - Mostly Cloudy</span><br>

                    <span><img class="check_mark_icon" src="/Assets/Images/check_mark.png" width="20" height="20"></span>
                </div>
		<div id="completed_tasks_title"></div>
		<div id="completed_tasks_container"></div>
	    </div>
        </div>

        <div class="mt-3">
            <span id="task_delete_message"></span>
        </div>

        <div>
            <span id="login_message"></span>
        </div>

        <footer class="mt-5 text-center">Moodana © 2025</footer>
    </div>

    <script src="/Scripts/index.js"></script>
</body>
</html>
