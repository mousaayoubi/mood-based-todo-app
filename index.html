<!DOCTYPE html>
<html>
	<head>
		<title>Homepage | Mood based ToDo App</title>
		<link rel="icon" type="image/x-icon" href="/Assets/Images/favicon.ico">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="This is a mood based todo app. This page is about the homepage.">
		<link rel="stylesheet" href="/Styles/index.css" />
		<!-- Link to Bootstrap for responsive design -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	</head>
	<body>
		<div class="container">
			<nav class="navbar">
				<a class="navbar-brand" href="/index.html">
					<img src="/Assets/Images/logo.png" alt="logo" width="75" height="75" class="d-inline-block align-left" /></a>
				<span id="welcome">Welcome <br /><span id="account">Guest</span>
					<img src="/Assets/Images/spacing.png" width="500" height="50" />

					<img src="/Assets/Images/mood.png" width="100" height="50" />
					<img src="/Assets/Images/weather.png" width="50" height="50" />
					<img src="/Assets/Images/account.png" width="50" height="50" />
			</nav>
			<div class="row">
				<!-- First column layout -->
				<div id="tasks" class="col">
					<span id="tasks_title">Ready for Today?</span><br /><span id="tasks_number">You have 3 tasks planned for today</span><span><img src="/Assets/Images/add_task.png" /><img src="/Assets/Images/complete_all.png" /><img src="/Assets/Images/show_completed.png" /></span>
					<div class="row">
						<div class="col">
							<img src="/Assets/Images/task_one.png" />
							<img src="/Assets/Images/task_two.png" />
						</div>
						<div class="col">
							<img src="/Assets/Images/task_three.png" />
						</div>
					</div>
				</div>
				<!-- Seconf column layout -->
				<div id="suggested_tasks" class="col">
					<span id="suggested_tasks_title">Suggested tasks</span><br />
					<img class="suggested_tasks_image" src="/Assets/Images/suggested_task_one.png" />
					<img class="suggested_tasks_image" src="/Assets/Images/suggested_task_two.png" />
				</div>
		</div>
	</body>
</html>
