<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Homepage | Mood based ToDo App | Moodana</title>
		<link rel="icon" type="image/x-icon" href="/Assets/Images/favicon.ico">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="This is a mood based todo app. This page is about the homepage.">
		<meta charset="UTF-8">
		<link rel="stylesheet" href="/Styles/index.css" />
		<!-- Link to Bootstrap for responsive design -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	</head>
	<body>
		<div class="container">
			<header>
				<nav class="navbar">
					<a class="navbar-brand" href="/">
						<img src="/Assets/Images/logo.png" alt="logo" width="75" height="75" class="d-inline-block align-left" /></a>
					<span id="welcome">Welcome <br /><span id="account">Guest</span>
						<img src="/Assets/Images/spacing.png" alt="spacing bar" width="500" height="50" />

						<a href="/Components/moodSelecterForm.html"><img src="/Assets/Images/mood.png" alt="mood selector icon" width="100" height="50" /></a>
						<img src="/Assets/Images/weather.png" alt="weather icon" width="50" height="50" />
						<img id="account_login" src="/Assets/Images/account.png" alt="account icon" width="50" height="50" />
				</nav>
			</header>
			<div class="row">
				<!-- First column layout -->
				<div id="tasks" class="col">
					<span id="tasks_title">Ready for Today?</span><br /><span id="tasks_number">You have tasks planned for today</span><span><a href="/Components/taskCreationForm.html"><img src="/Assets/Images/add_task.png" alt="add task icon" /></a><img src="/Assets/Images/complete_all.png" alt="complete all icon" /><img src="/Assets/Images/show_completed.png" alt="show completed icon" /></span>
					<div class="row">
						<div id="added_tasks" class="col">
						 <div id="task_name_border1">
							 <div class="delete_hover"><a href=""><img id="delete_bin" src="/Assets/Images/bin.png" alt="bin icon" width="20px" height="20px" /></a></div>
								 <img id="check_mark1" src="/Assets/Images/check_mark.png" alt="check mark icon" width="20px" height="20px" />
							<div id="task_name1"></div>
							<div id="task_duration1"></div>
							<div id="task_time1"></div>
							</div>
							<div id="task_name_border2">
								<div class="delete_hover"><a href=""><img id="delete_bin" src="/Assets/Images/bin.png" alt="bin icon" width="20px" height="20px" /></a></div>
							<img id="check_mark2" src="/Assets/Images/check_mark.png" alt="check mark icon" width="20px" height="20px" />

							<div id="task_name2"></div>
                                                        <div id="task_duration2"></div>
                                                        <div id="task_time2"></div>
							</div>
						</div>
						<div id="added_tasks" class="col">
							<div id="task_name_border3">
								<div class="delete_hover"><a href=""><img id="delete_bin" src="/Assets/Images/bin.png" alt="bin icon" width="20px" height="20px" /></a></div>
							<img id="check_mark3" src="/Assets/Images/check_mark.png" alt="check mark icon" width="20px" height="20px" />

							<div id="task_name3"></div>
                                                        <div id="task_duration3"></div>
                                                        <div id="task_time3"></div>
							</div>
						</div>
					</div>
				</div>
				<!-- Second column layout -->
				<div id="suggested_tasks" class="col">
					<span id="suggested_tasks_title">Suggested tasks</span><br />
					<img class="suggested_tasks_image" src="/Assets/Images/suggested_task_one.png" alt="suggested task one card" />
					<img class="suggested_tasks_image" src="/Assets/Images/suggested_task_two.png" alt="suggested task two card" />
				</div>
		</div>
		<div<span id="login_message"></span></div>
		<footer>Moodana © 2025</footer>
	</body>
	<script src="/Scripts/index.js"></script>
</html>
